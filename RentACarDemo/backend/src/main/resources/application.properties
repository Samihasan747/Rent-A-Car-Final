spring.application.name=RentACarDemo

# Comma-separated list of browser origins allowed to call the API.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

spring.datasource.url=jdbc:mysql://localhost:3306/rentacardemo_db
spring.datasource.username=root
spring.datasource.password=MySQL@747

spring.jpa.hibernate.ddl-auto=none

# Flyway owns the schema from Phase B onwards. Existing databases are baselined
# at version 0 so V1 and V2 run on them.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (HS256, 15-minute expiry). Secret is a base64 HMAC key.
jwt.secret=n/BcSh5t7+V+4pl5WvCSuhIAJmVMFff/9m0g9fLGPS0=
jwt.issuer=rentacar-api
jwt.expiry=900

# Car image uploads (filesystem storage; not inside frontend/public).
app.upload.dir=./uploads/cars
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=55MB